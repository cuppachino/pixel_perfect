[workspace]
default-members = ["crates/bevy_track_asset"]
members = ["crates/bevy_track_asset"]
resolver = "2"

[workspace.package]
edition = "2024"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"

[workspace.dependencies]
# Packages
bevy_track_asset = { path = "crates/bevy_track_asset" }
# Bevy Core
bevy_app = { version = "0.18.1" }
bevy_ecs = { version = "0.18.1" }
bevy_asset = { version = "0.18.1" }
bevy_log = { version = "0.18.1" }
bevy_platform = { version = "0.18.1" }
