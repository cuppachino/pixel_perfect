name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings -C debuginfo=line-tables-only
  RUSTDOCFLAGS: --deny warnings

jobs:
  check:
    name: Check Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-all-crates: true
          shared-key: lints
      - name: Install Linux dependencies (Bevy)
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx264-164 libx264-dev
      - name: Run cargo check
        run: cargo check --locked --workspace --all-targets
  # ----------------------------------------
  # Documentation
  # ----------------------------------------
  docs:
    name: Check Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-all-crates: true
          shared-key: lints
      - name: Install Linux dependencies (Bevy)
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx264-164 libx264-dev
      - name: Cargo doc
        run: cargo doc --locked --workspace --no-deps --keep-going
  # ----------------------------------------
  # Per-crate feature validation (KEY JOB)
  # ----------------------------------------
  features:
    name: Feature permutations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install Linux dependencies (Bevy)
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx264-164 libx264-dev

      - name: Check each crate with feature combinations
        run: |
          set -e

          cargo metadata --no-deps --format-version=1 > meta.json

          jq -c '.packages[]' meta.json | while read pkg; do
            NAME=$(echo "$pkg" | jq -r '.name')
            FEATURES=$(echo "$pkg" | jq -r '.features | keys[]?')

            echo "=============================="
            echo "Crate: $NAME"
            echo "=============================="

            echo "--- no features ---"
            cargo check -p $NAME --no-default-features

            for feat in $FEATURES; do
              echo "--- feature: $feat ---"
              cargo check -p $NAME --no-default-features --features $feat
            done

            echo "--- all features ---"
            cargo check -p $NAME --all-features
          done
  # ----------------------------------------
  # Linting
  # ----------------------------------------
  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-all-crates: true
          shared-key: lints
      - name: Install Linux dependencies (Bevy)
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx264-164 libx264-dev
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
