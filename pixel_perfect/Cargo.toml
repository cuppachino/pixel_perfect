[package]
name = "pixel_perfect"
authors = ["Jacob Bergholtz <cuppachino.dev@gmail.com>"]
version = "0.1.0"
edition = "2024"
resolver = "2"

[dependencies]
serde = { workspace = true, features = ["derive"] }
# Bevy Core
bevy_derive = { workspace = true, optional = true }
bevy_app = { workspace = true, optional = true }
bevy_color = { workspace = true, optional = true }
bevy_ecs = { workspace = true, optional = true }
bevy_asset = { workspace = true, optional = true }
bevy_math = { workspace = true, optional = true }
bevy_platform = { workspace = true, optional = true }
bevy_reflect = { workspace = true, optional = true }
# Bevy Images
bevy_image = { workspace = true, optional = true }
bevy_render = { workspace = true, optional = true }
# Bevy UI
bevy_ui = { workspace = true, optional = true }
# Bevy 2D
bevy_sprite = { workspace = true, optional = true }
font = { workspace = true, optional = true }

[features]
default = ["font", "bevy_ui", "bevy_2d"]
font = ["dep:font"]
composite_text = ["font"]
per_glyph_text = ["font"]
bevy = [
    "dep:bevy_app",
    "dep:bevy_asset",
    "dep:bevy_derive",
    "dep:bevy_ecs",
    "dep:bevy_platform",
    "dep:bevy_reflect",
    "font/bevy",
]
bevy_ui = ["bevy", "dep:bevy_color", "dep:bevy_ui"]
bevy_2d = ["bevy", "dep:bevy_color", "dep:bevy_sprite"]

# Example dependencies
[dev-dependencies]
bevy = { version = "0.18.1", features = ["file_watcher"] }
